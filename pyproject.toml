[project]
name = "instinct-bizarre-adventure"
version = "0.1.0"
description = "Instinct language interpreter and JoJo-themed creature simulator"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that are slow (e.g. 1000 ticks, performance benchmarks)",
]
